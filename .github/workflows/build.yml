
name: Build and Release VideoDownloader

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build VideoDownloader
        run: >
          python -m PyInstaller --noconfirm --clean
          --windowed --onedir --contents-directory .
          --name VideoDownloader Video_downloader.py

      
      - name: Download existing tool bundle
        shell: pwsh
        run: |
          $releaseUrl = "https://api.github.com/repos/kundanet/VideoDownloader-version-1.0/releases/tags/v1.0.0"
          $release = Invoke-RestMethod -Uri $releaseUrl

          $asset = $release.assets |
            Where-Object { $_.name -like "VideoDownloader-Windows*.zip" } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Could not find the VideoDownloader ZIP in release v1.0.0."
          }

          $zip = "$env:RUNNER_TEMP\tools.zip"
          $folder = "$env:RUNNER_TEMP\tools"

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $folder -Force

          $destination = "dist\VideoDownloader"
          $tools = @("yt-dlp.exe", "ffmpeg.exe", "ffprobe.exe", "deno.exe")

          foreach ($tool in $tools) {
            $found = Get-ChildItem -Path $folder -Filter $tool -File -Recurse |
              Select-Object -First 1

            if (-not $found) {
              throw "Missing required tool: $tool"
            }

            Copy-Item $found.FullName -Destination $destination -Force
          }

      - name: Package complete Windows app
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\VideoDownloader\*" `
            -DestinationPath "dist\VideoDownloader-Windows.zip" `
            -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Windows
          path: dist/VideoDownloader-Windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoDownloader-Windows.zip
          generate_release_notes: true